name: Biome Lint & Fix

on:
  push:
    branches: [main, 'cursor/**']
  pull_request:
    branches: [main]

jobs:
  lint-and-fix:
    runs-on: ubuntu-latest
    name: Lint & Auto-Fix

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Auto-fix linting issues
        run: bun run lint:fix
        continue-on-error: true

      - name: Check for remaining linting errors
        run: bun run lint
        id: lint-check

      - name: Fail if linting errors remain
        if: steps.lint-check.outcome == 'failure'
        run: |
          echo "::error::❌ Linting failed! There are unfixable linting errors."
          echo "::error::Please run 'bun run lint:fix' locally and fix any remaining errors."
          echo "::error::Then commit and push the fixes."
          exit 1

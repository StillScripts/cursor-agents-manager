name: Biome Lint Check

on:
  push:
    branches: [main]

jobs:
  lint-check:
    runs-on: ubuntu-latest
    name: Lint Check

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Check for linting errors
        run: bun run lint
